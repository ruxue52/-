server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: shuhaige-psi
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookstore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # HS256 要求密钥长度 >= 32 字节
  secret: ${JWT_SECRET:shuhaige-psi-secret-key-2026-bookstore-erp-sign}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

logging:
  level:
    com.shuhaige.psi: info