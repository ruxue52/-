name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven 编译打包
        run: mvn -B -DskipTests package

      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: psi-backend-jar
          path: 03-backend/target/psi-backend.jar
          retention-days: 7

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-frontend-web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 04-frontend-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Vite 构建
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: psi-web-dist
          path: 04-frontend-web/dist
          retention-days: 7

  docker:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./03-backend
          push: false
          tags: psi-backend:ci
          cache-from: type=gha,scope=psi-backend
          cache-to: type=gha,mode=max,scope=psi-backend

      - name: 构建 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./04-frontend-web
          push: false
          tags: psi-web:ci
          cache-from: type=gha,scope=psi-web
          cache-to: type=gha,mode=max,scope=psi-web

      - name: 校验 docker-compose 配置
        run: docker compose -p psi-erp config --quiet
